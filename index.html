<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="google-site-verification" content="R_NrA3zI61o-u25Pfhs-vnFLYytCAH-q3A1XkEwV2q0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>all in one </title>
    <link rel="icon" href="012.png" type="image/x-icon">
    
    <meta name="google-site-verification" content="R_NrA3zI61o-u25Pfhs-vnFLYytCAH-q3A1XkEwV2q0" />
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        @keyframes buttonBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0);}
            40% { transform: translateY(-10px);}
            60% { transform: translateY(-5px);}
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #E7EDF2;
            font-family: 'Roboto', sans-serif;
            color: #2B3440;
            animation: fadeInUp 1s ease-out;
            direction: rtl;
        }
        .container-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .logo {
            display: block;
            margin: 0 auto 30px;
            margin-left: auto;
            margin-right: auto;
            max-width: 220px;
            width: 80vw;
            animation: fadeInUp 1s ease-out;
            animation-delay: 0.3s;
            animation-fill-mode: both;
        }
        .container {
            text-align: center;
            background: #F4F7FB;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(43, 57, 75, 0.12);
            max-width: 500px;
            width: 95vw;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out;
            animation-delay: 0.5s;
            animation-fill-mode: both;
            position: relative;
        }
        .container h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #1E2A38;
            animation: fadeInUp 1s ease-out;
            animation-delay: 1s;
            animation-fill-mode: both;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            padding: 15px 25px;
            font-size: 18px;
            color: #FFFFFF;
            background-image: linear-gradient(45deg, #21325E, #172346);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            max-width: 300px;
            width: 100%;
            animation: buttonBounce 2s infinite;
            box-sizing: border-box;
            gap: 8px;
        }
        .button:hover, .button:focus {
            background-image: linear-gradient(45deg, #1f315b, #1f315b);
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(43, 57, 75, 0.18);
            outline: none;
        }
        .button:active {
            transform: translateY(1px);
            box-shadow: 0 6px 10px rgba(43, 57, 75, 0.15);
        }
        .button svg {
            width: 22px;
            height: 22px;
        }
        .footer {
            margin-top: 15px;
            padding-top: 15px;
            color: #4D5C6E;
            font-size: 15px;
            text-align: center;
            max-width: 500px;
            width: 95vw;
            background: transparent;
        }
        .footer a {
            color: #21325E;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .container h1 {
                font-size: 18px;
            }
            .button {
                font-size: 15px;
                padding: 12px 10px;
            }
            .logo {
                max-width: 120px;
            }
            .footer {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container-wrapper">
        <img src="MAIN LOGO 1.png" alt="ALL IN ONE" class="logo">
        <div class="container">
            <h1> Welcome to All in One services  </h1>
            <!-- Font Awesome CDN -->
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScXNsmN8CP4o4bLno2krvpcNMfYBKLRR9jBnPbO2_hnms_5Ew/viewform?usp=header" class="button" target="_blank" rel="noopener">
                <i class="fas fa-globe"></i>
                For IT services
            </a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSe13mKehWzr9UhQV2xBpWpp_7i-Q4rcMBNcFsKz_zBAaQdq3A/viewform?usp=header" class="button" target="_blank" rel="noopener">
                <i class="fas fa-gem"></i>
                For jewelry services
            </a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSetjB4s4O2trj5HFipvSHgOKImDK7gIfwrHpgzj90VXAkZzJw/viewform?usp=header" class="button" target="_blank" rel="noopener">
                <i class="fas fa-paint-brush"></i>
                For all types of graphic design 
            </a>
            <a href="https://www.linkedin.com/in/kyrillos-girgis-482860225?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=ios_app" class="button" target="_blank" rel="noopener">
                <i class="fab fa-linkedin-in"></i>
                Linkedin
            </a>
            <a href="000000000000000000000000000000" class="button" target="_blank" rel="noopener">
                <i class="fab fa-instagram"></i>
                instagram
            </a>
        </div>
        <div class="footer">
            <p>
                Copyright &copy;<script>document.write(new Date().getFullYear());</script>. All Rights Reserved. &mdash; Designed and Developed BY
                <a href="https://all-1n-one.github.io/all-in-1/">ALL IN ONE</a>
            </p>
        </div>
    </div>
    <script>
        //     FOR MOBILE TOUCH EVENTS
        document.querySelectorAll('.button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('active');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('active');
            });
        });
    </script>
</body>
</html>
